name: release

# A pharos release (ADR-035 §7), after geex's release.yml:
#   1. build          — one job per target on its own runner, with the runtime
#                       rel/build-runtime.sh builds (cached): a release build
#                       (PHAROS_RELEASE=1: native check enforced), the ADR-034
#                       integration suite against it, and an install.sh smoke
#                       of the tarball from file://.
#   2. build-windows  — win-x64 with OTP's official Windows build, direct mode
#                       only (ADR-034); a zip for the npm package.
#   3. publish        — only for a `v*` tag: a GitHub release (marked latest)
#                       with the tarballs, the zip, SHA256SUMS and install.sh,
#                       then the five npm platform packages and pharos-mcp.
#   4. smoke          — only for a `v*` tag: smoke.yml installs the published
#                       release from its public URLs on fresh runners.
#
# A branch push (ci/**) or a manual run builds and checks everything and
# publishes nothing.
#
# Auth: npm Trusted Publishing (OIDC), no NPM_TOKEN. The Trusted Publisher
# entry on npmjs.com for each of the six packages names this file,
# release.yml: keep the name.

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer branch push cancels the older dry run; a tag's run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          key: ${{ matrix.target }}-${{ matrix.runner }}

      - name: The version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^  @version_base "\(.*\)"$/\1/p' mix.exs)
          [ -n "$version" ] || { echo "no @version_base in mix.exs" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "the tag $GITHUB_REF_NAME doesn't name mix.exs's version $version" >&2
            exit 1
          fi

      # PHAROS_RELEASE=1: the plain version and the native check enforced
      # (ADR-035 §3).
      - name: Build
        env:
          MIX_ENV: prod
          PHAROS_RELEASE: "1"
        run: |
          mix deps.get
          mix release --overwrite
          ls -l _build/package
          test -f "_build/package/pharos-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"

      - name: Check the shell scripts
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh rel/smoke.sh

      - name: Integration suite (ADR-034) against the release
        timeout-minutes: 15
        run: python3 -I test/daemon/integration.py --release _build/prod/rel/pharos --shim _build/prod/rel/pharos/bin/pharos

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pyright (the smoke's language server)
        run: npm install -g pyright

      - name: Smoke-test the tarball through install.sh
        timeout-minutes: 10
        run: PHAROS_DOWNLOAD_URL="file://$PWD/_build/package" sh rel/smoke.sh --version "${{ steps.version.outputs.version }}" --lsp pyright

      - uses: actions/upload-artifact@v4
        with:
          name: pharos-${{ matrix.target }}
          path: _build/package/*
          if-no-files-found: error

  build-windows:
    name: build win32-x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1.1"
          elixir-version: "1.19.5"
          gleam-version: "1.17.0"
          rebar3-version: "3.27.0"

      - name: The mix_gleam fork
        shell: bash
        run: mix archive.install --force github LoganBresnahan/mix_gleam

      - name: Build
        shell: bash
        env:
          MIX_ENV: prod
          PHAROS_RELEASE: "1"
        run: |
          mix deps.get
          mix release --overwrite
          ls -l _build/package

      # No daemon on Windows (ADR-034): direct mode, stdio to a child BEAM.
      - name: Smoke the release in place
        shell: bash
        run: |
          bin=_build/prod/rel/pharos/bin/pharos.exe
          "$bin" --version
          python - "$bin" <<'PY'
          import json, subprocess, sys
          lines = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2024-11-05", "capabilities": {}, "clientInfo": {"name": "smoke", "version": "0"}}},
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          ]
          out = subprocess.run([sys.argv[1]], input="".join(json.dumps(l) + "\n" for l in lines),
                               capture_output=True, text=True, timeout=120).stdout
          replies = [json.loads(l) for l in out.splitlines() if l.strip()]
          ids = sorted(r.get("id") for r in replies)
          assert ids == [1, 2], "expected replies 1 and 2, got %r\n%s" % (ids, out[:2000])
          print("smoke: ok: initialize and tools/list in direct mode (%d tools)" % len(replies[1]["result"]["tools"]))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pharos-win32-x64
          path: _build/package/*
          if-no-files-found: error

  publish:
    needs: [build, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # the GitHub release
      id-token: write   # npm trusted publishing
    outputs:
      version: ${{ steps.files.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: built

      - name: Gather the release files
        id: files
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir dist
          cp built/*/pharos-*.tar.gz built/*/pharos-*.zip dist/
          cat built/*/SHA256SUMS | sort -k2 > dist/SHA256SUMS
          cp install.sh dist/
          (cd dist && sha256sum -c SHA256SUMS)
          ls -l dist
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A normal release, marked latest: releases/latest/download/install.sh is this one.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          prerelease=--latest
          if [[ "$version" == *-* ]]; then prerelease=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "pharos $version" \
            $prerelease \
            --notes "Install or upgrade (Linux, macOS):

          \`\`\`sh
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh
          \`\`\`

          or \`npm install -g pharos-mcp\` (Linux, macOS, Windows). MCP client configs keep working: the command is still \`pharos\`.

          - Linux x64 and arm64 need glibc 2.35+. pharos 0.2 needs glibc 2.35+ (Alpine/musl and older distros aren't supported yet); pharos-mcp@0.1.4 still runs there.
          - macOS on Apple silicon and Intel; Windows x64 through npm.
          - \`PHAROS_INSTALL_DIR\` now names install.sh's install root (default \`~/.local/share/pharos\`), not Burrito's extraction directory. After upgrading from 0.1.x, \`pharos --purge-cache\` removes 0.1.x's unused unpacks.

          What changed: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: npm 11 (trusted publishing needs npm >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Fill the npm platform packages from the release files
        run: |
          set -e
          version=${GITHUB_REF_NAME#v}
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            dest="npm/@pharos-mcp/$target"
            rm -rf "$dest/release" "$RUNNER_TEMP/unpack"
            mkdir -p "$RUNNER_TEMP/unpack"
            tar -xzf "dist/pharos-$version-$target.tar.gz" -C "$RUNNER_TEMP/unpack"
            mv "$RUNNER_TEMP/unpack/pharos-$version-$target" "$dest/release"
            test -x "$dest/release/bin/pharos"
          done
          rm -rf "$RUNNER_TEMP/unpack" npm/@pharos-mcp/win-x64/release
          mkdir -p "$RUNNER_TEMP/unpack"
          (cd "$RUNNER_TEMP/unpack" && unzip -q "$GITHUB_WORKSPACE/dist/pharos-$version-win32-x64.zip")
          mv "$RUNNER_TEMP/unpack/pharos-$version-win32-x64" npm/@pharos-mcp/win-x64/release
          test -f npm/@pharos-mcp/win-x64/release/bin/pharos.exe

      - name: Stamp the version into all six package.jsons, and LICENSE into each
        run: |
          set -e
          version=${GITHUB_REF_NAME#v}
          for pkg in pharos-mcp @pharos-mcp/linux-x64 @pharos-mcp/linux-arm64 @pharos-mcp/darwin-x64 @pharos-mcp/darwin-arm64 @pharos-mcp/win-x64; do
            node -e '
              const fs = require("fs");
              const [file, v] = process.argv.slice(1);
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = v;
              for (const k of Object.keys(pkg.optionalDependencies || {})) pkg.optionalDependencies[k] = v;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            ' "npm/$pkg/package.json" "$version"
            cp LICENSE "npm/$pkg/LICENSE"
          done

      - name: Publish the platform packages, then pharos-mcp
        run: |
          set -e
          version=${GITHUB_REF_NAME#v}
          tag=latest
          if [[ "$version" == *-* ]]; then tag=next; fi
          for pkg in @pharos-mcp/linux-x64 @pharos-mcp/linux-arm64 @pharos-mcp/darwin-x64 @pharos-mcp/darwin-arm64 @pharos-mcp/win-x64 pharos-mcp; do
            echo "==> $pkg $version ($tag)"
            (cd "npm/$pkg" && npm publish --provenance --access public --tag "$tag")
          done

  smoke:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/smoke.yml
    with:
      version: ${{ needs.publish.outputs.version }}
