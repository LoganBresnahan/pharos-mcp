name: release

# A pharos release (ADR-035 §7), after geex's release.yml:
#   1. build          — one job per target on its own runner, with the runtime
#                       rel/build-runtime.sh builds (cached): a release build
#                       (PHAROS_RELEASE=1: native check enforced), the ADR-034
#                       integration suite against it, and an install.sh smoke
#                       of the tarball from file://.
#   2. publish        — only for a `v*` tag: a GitHub release (marked latest)
#                       with the tarballs, SHA256SUMS and install.sh, then the
#                       four npm platform packages, then (once npm can install
#                       all four) pharos-mcp.
#   3. smoke          — only for a `v*` tag: smoke.yml installs the published
#                       release from its public URLs on fresh runners.
#
# A branch push (ci/**) or a manual run builds and checks everything and
# publishes nothing.
#
# Recovery: a manual run with `republish: <version>` builds nothing. It
# refills the npm packages from that version's GitHub release (tag
# checkout, SHA256SUMS checked), publishes whichever of the five npm
# hasn't got, and smokes. 0.2.2 needed it: npm accepted all four platform
# publishes ("being processed"), then never stored the two arm64 ones (no
# tarball, no attestation), and the wait step held pharos-mcp back.
#
# There is no Windows build: Windows users run pharos inside WSL (ADR-035).
#
# Auth: npm Trusted Publishing (OIDC), no NPM_TOKEN. The Trusted Publisher
# entry on npmjs.com for each package names this file, release.yml: keep
# the name.

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]
  workflow_dispatch:
    inputs:
      republish:
        description: "Recovery: a released version (e.g. 0.2.2) whose npm publish didn't finish. Builds nothing."
        type: string
        default: ""

permissions:
  contents: read

# A newer branch push cancels the older dry run; a tag's run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
    if: ${{ !inputs.republish }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          key: ${{ matrix.target }}-${{ matrix.runner }}

      - name: The version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^  @version_base "\(.*\)"$/\1/p' mix.exs)
          [ -n "$version" ] || { echo "no @version_base in mix.exs" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "the tag $GITHUB_REF_NAME doesn't name mix.exs's version $version" >&2
            exit 1
          fi

      # PHAROS_RELEASE=1: the plain version and the native check enforced
      # (ADR-035 §3).
      - name: Build
        env:
          MIX_ENV: prod
          PHAROS_RELEASE: "1"
        run: |
          mix deps.get
          mix release --overwrite
          ls -l _build/package
          test -f "_build/package/pharos-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"

      - name: Check the shell scripts
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh rel/smoke.sh

      - name: Integration suite (ADR-034) against the release
        timeout-minutes: 15
        run: python3 -I test/daemon/integration.py --release _build/prod/rel/pharos --shim _build/prod/rel/pharos/bin/pharos

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pyright (the smoke's language server)
        run: npm install -g pyright

      - name: Smoke-test the tarball through install.sh
        timeout-minutes: 10
        run: PHAROS_DOWNLOAD_URL="file://$PWD/_build/package" sh rel/smoke.sh --version "${{ steps.version.outputs.version }}" --lsp pyright

      - uses: actions/upload-artifact@v4
        with:
          name: pharos-${{ matrix.target }}
          path: _build/package/*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() && ((startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success') || inputs.republish) }}
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.republish && format('v{0}', inputs.republish) || github.ref_name }}
    permissions:
      contents: write   # the GitHub release
      id-token: write   # npm trusted publishing
    outputs:
      version: ${{ steps.files.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        if: ${{ !inputs.republish }}
        with:
          path: built

      - name: Gather the release files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPUBLISH: ${{ inputs.republish }}
        run: |
          set -e
          version=${RELEASE_TAG#v}
          if ! printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
            echo "not a version: $version" >&2
            exit 1
          fi
          mkdir dist
          if [ -n "$REPUBLISH" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
              --pattern 'pharos-*.tar.gz' --pattern SHA256SUMS --pattern install.sh
          else
            cp built/*/pharos-*.tar.gz dist/
            cat built/*/SHA256SUMS | sort -k2 > dist/SHA256SUMS
            cp install.sh dist/
          fi
          (cd dist && sha256sum -c SHA256SUMS)
          ls -l dist
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A normal release, marked latest: releases/latest/download/install.sh is this one.
      - name: Publish the GitHub release
        if: ${{ !inputs.republish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${RELEASE_TAG#v}
          prerelease=--latest
          if [[ "$version" == *-* ]]; then prerelease=--prerelease; fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "pharos $version" \
            $prerelease \
            --notes "Install or upgrade (Linux, macOS):

          \`\`\`sh
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh
          \`\`\`

          or \`npm install -g pharos-mcp\`. MCP client configs keep working: the command is still \`pharos\`.

          - Linux x64 and arm64 need glibc 2.35+ (Alpine/musl and older distros aren't supported yet; pharos-mcp@0.1.4 still runs there).
          - macOS on Apple silicon and Intel.
          - Windows: install it inside WSL (pharos-mcp@0.1.4 was the last native Windows build).
          - Installed with install.sh: \`pharos self update\` upgrades, \`pharos self rollback\` goes back, \`pharos self prune\` removes old versions (and what pharos 0.1.x unpacked), \`pharos self uninstall\` removes it. Installed with npm: \`npm install -g pharos-mcp@latest\`.

          What changed: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/CHANGELOG.md)."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: npm 11 (trusted publishing needs npm >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Fill the npm platform packages from the release files
        run: |
          set -e
          version=${RELEASE_TAG#v}
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            dest="npm/@pharos-mcp/$target"
            rm -rf "$dest/release" "$RUNNER_TEMP/unpack"
            mkdir -p "$RUNNER_TEMP/unpack"
            tar -xzf "dist/pharos-$version-$target.tar.gz" -C "$RUNNER_TEMP/unpack"
            mv "$RUNNER_TEMP/unpack/pharos-$version-$target" "$dest/release"
            test -x "$dest/release/bin/pharos"
          done

      - name: Stamp the version into all five package.jsons, and LICENSE into each
        run: |
          set -e
          version=${RELEASE_TAG#v}
          for pkg in pharos-mcp @pharos-mcp/linux-x64 @pharos-mcp/linux-arm64 @pharos-mcp/darwin-x64 @pharos-mcp/darwin-arm64; do
            node -e '
              const fs = require("fs");
              const [file, v] = process.argv.slice(1);
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = v;
              for (const k of Object.keys(pkg.optionalDependencies || {})) pkg.optionalDependencies[k] = v;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            ' "npm/$pkg/package.json" "$version"
            cp LICENSE "npm/$pkg/LICENSE"
          done

      # Idempotent, so a recovery run (or a re-run) publishes only what npm
      # hasn't got. `npm view` reads the full document from the registry
      # origin. If npm answers "previously published" for a version it
      # doesn't show, it holds that version somewhere it won't serve: the
      # version is burnt, and only a new release can fix it.
      - name: Publish the platform packages
        run: |
          set -e
          version=${RELEASE_TAG#v}
          tag=latest
          if [[ "$version" == *-* ]]; then tag=next; fi
          for pkg in @pharos-mcp/linux-x64 @pharos-mcp/linux-arm64 @pharos-mcp/darwin-x64 @pharos-mcp/darwin-arm64; do
            if [ "$(npm view "$pkg@$version" version 2>/dev/null)" = "$version" ]; then
              echo "==> $pkg $version is already on npm; skipping"
              continue
            fi
            echo "==> $pkg $version ($tag)"
            (cd "npm/$pkg" && npm publish --provenance --access public --tag "$tag")
          done

      # pharos-mcp only once npm can install every platform package. npm
      # install reads the abbreviated install document, which the CDN
      # caches apart from the full one and serves late: right after 0.2.0's
      # publish, `npm i -g pharos-mcp` resolved the main package, then
      # silently skipped its optional platform package (still 404 there),
      # and the postinstall failed. Publishing the main package last, once
      # every platform version is installable, closes most of that window
      # for users.
      - name: Wait until npm can install every platform package
        run: |
          version=${RELEASE_TAG#v}
          for i in $(seq 1 60); do
            missing=
            for plat in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
              curl -fsS -H 'Accept: application/vnd.npm.install-v1+json' \
                "https://registry.npmjs.org/@pharos-mcp%2f$plat" 2>/dev/null \
                | python3 -c 'import json,sys; sys.exit(0 if sys.argv[1] in json.load(sys.stdin)["versions"] else 1)' "$version" \
                || missing="$missing $plat"
            done
            if [ -z "$missing" ]; then
              # This runner's CDN edge is fresh, but the install document is
              # served with `cache-control: public, max-age=300`, so another
              # Cloudflare edge can serve its stale copy for up to five more
              # minutes. Wait out one max-age so every user sees the platform
              # packages before the main package's new version appears.
              echo "every platform package at $version is installable here; waiting out max-age=300 for other edges"
              sleep 300
              exit 0
            fi
            echo "not installable yet:$missing (try $i)"
            sleep 15
          done
          echo "platform packages still not installable after 15 min:$missing" >&2
          exit 1

      - name: Publish pharos-mcp
        run: |
          set -e
          version=${RELEASE_TAG#v}
          tag=latest
          if [[ "$version" == *-* ]]; then tag=next; fi
          if [ "$(npm view "pharos-mcp@$version" version 2>/dev/null)" = "$version" ]; then
            echo "==> pharos-mcp $version is already on npm; skipping"
            exit 0
          fi
          echo "==> pharos-mcp $version ($tag)"
          (cd npm/pharos-mcp && npm publish --provenance --access public --tag "$tag")

  smoke:
    needs: publish
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.republish }}
    uses: ./.github/workflows/smoke.yml
    with:
      version: ${{ needs.publish.outputs.version }}
