# The post-release smoke (ADR-035 §7): on fresh runners, install a published
# pharos from its public URLs, exactly as a user would, and run it as an MCP
# client would. release.yml calls it after publishing; run it by hand for any
# version.
name: smoke

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The version to install (as published on npm and GitHub)
        type: string
        required: true

permissions:
  contents: read

jobs:
  # curl … install.sh | sh, then initialize, tools/list, a pyright hover, a
  # second session on the same daemon, and the daemon's idle exit.
  curl:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-22.04-arm, ubuntu-24.04-arm, macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      # The smoke scripts only: pharos itself comes from the release.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rel
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pyright
      - name: Smoke
        run: sh rel/smoke.sh --version "${{ inputs.version }}" --lsp pyright

  # npm install -g pharos-mcp@VERSION: the same checks, and the postinstall
  # swap proved: no node in the MCP server's process tree.
  npm:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-22.04-arm, ubuntu-24.04-arm, macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rel
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The registry takes minutes to serve a version everywhere after a
      # publish, and `npm install` reads the abbreviated install document
      # (Accept: application/vnd.npm.install-v1+json), which the CDN caches
      # apart from the full one `npm view` reads. 0.2.0's npm jobs passed a
      # `npm view` wait and still got a stale install document, so npm
      # silently skipped the optional platform package. Poll the install
      # document itself, then install and check the platform package landed.
      - name: Wait for the registry to serve ${{ inputs.version }}
        shell: bash
        run: |
          v="${{ inputs.version }}"
          for i in $(seq 1 45); do
            missing=
            for pkg in pharos-mcp @pharos-mcp/linux-x64 @pharos-mcp/linux-arm64 @pharos-mcp/darwin-x64 @pharos-mcp/darwin-arm64; do
              curl -fsSL -H 'Accept: application/vnd.npm.install-v1+json' \
                "https://registry.npmjs.org/$(printf %s "$pkg" | sed 's|/|%2F|')" 2>/dev/null \
                | python3 -c 'import json,sys; sys.exit(0 if sys.argv[1] in json.load(sys.stdin)["versions"] else 1)' "$v" \
                || missing="$missing $pkg"
            done
            [ -z "$missing" ] && { echo "all packages at $v are in the install documents"; exit 0; }
            echo "not yet:$missing (try $i)"
            sleep 20
          done
          echo "not visible on the registry after 15 min:$missing at $v" >&2
          exit 1
      - name: Install
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) plat=linux-x64 ;; Linux-aarch64) plat=linux-arm64 ;;
            Darwin-x86_64) plat=darwin-x64 ;; Darwin-arm64) plat=darwin-arm64 ;;
          esac
          for i in $(seq 1 20); do
            if npm install -g --prefer-online pyright "pharos-mcp@${{ inputs.version }}" \
               && npm ls -g "@pharos-mcp/$plat" >/dev/null 2>&1; then
              exit 0
            fi
            echo "the platform package @pharos-mcp/$plat didn't land (try $i); retrying"
            npm uninstall -g pharos-mcp >/dev/null 2>&1 || true
            sleep 30
          done
          exit 1
      - name: pharos is the native shim
        run: |
          link=$(npm prefix -g)/lib/node_modules/pharos-mcp/bin/pharos.js
          [ -L "$link" ] || { echo "the postinstall didn't swap $link for the native shim" >&2; exit 1; }
          pharos --version
          [ "$(pharos --version)" = "pharos ${{ inputs.version }}" ]
      - name: pharos self update names the npm command
        shell: bash
        run: |
          if out=$(pharos self update 2>&1); then echo "self update should exit non-zero under npm: $out" >&2; exit 1; fi
          echo "$out"
          [[ "$out" == *"npm install -g pharos-mcp@latest"* ]] || { echo "self update didn't print the npm command" >&2; exit 1; }
      - name: Smoke
        env:
          PHAROS_RUNTIME_DIR: ${{ runner.temp }}/pharos-rt
        run: python3 -I rel/smoke_mcp.py --pharos "$(command -v pharos)" --expect-native --lsp pyright --idle-exit

  # npm install -g --ignore-scripts: the postinstall never runs, and the JS
  # fallback still serves MCP.
  npm-ignore-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rel
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The registry takes minutes to serve a version everywhere after a
      # publish, and `npm install` reads the abbreviated install document
      # (Accept: application/vnd.npm.install-v1+json), which the CDN caches
      # apart from the full one `npm view` reads. 0.2.0's npm jobs passed a
      # `npm view` wait and still got a stale install document, so npm
      # silently skipped the optional platform package. Poll the install
      # document itself, then install and check the platform package landed.
      - name: Wait for the registry to serve ${{ inputs.version }}
        shell: bash
        run: |
          v="${{ inputs.version }}"
          for i in $(seq 1 45); do
            missing=
            for pkg in pharos-mcp @pharos-mcp/linux-x64 @pharos-mcp/linux-arm64 @pharos-mcp/darwin-x64 @pharos-mcp/darwin-arm64; do
              curl -fsSL -H 'Accept: application/vnd.npm.install-v1+json' \
                "https://registry.npmjs.org/$(printf %s "$pkg" | sed 's|/|%2F|')" 2>/dev/null \
                | python3 -c 'import json,sys; sys.exit(0 if sys.argv[1] in json.load(sys.stdin)["versions"] else 1)' "$v" \
                || missing="$missing $pkg"
            done
            [ -z "$missing" ] && { echo "all packages at $v are in the install documents"; exit 0; }
            echo "not yet:$missing (try $i)"
            sleep 20
          done
          echo "not visible on the registry after 15 min:$missing at $v" >&2
          exit 1
      - name: Install
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) plat=linux-x64 ;; Linux-aarch64) plat=linux-arm64 ;;
            Darwin-x86_64) plat=darwin-x64 ;; Darwin-arm64) plat=darwin-arm64 ;;
          esac
          for i in $(seq 1 20); do
            if npm install -g --prefer-online --ignore-scripts "pharos-mcp@${{ inputs.version }}" \
               && npm ls -g "@pharos-mcp/$plat" >/dev/null 2>&1; then
              exit 0
            fi
            echo "the platform package @pharos-mcp/$plat didn't land (try $i); retrying"
            npm uninstall -g pharos-mcp >/dev/null 2>&1 || true
            sleep 30
          done
          exit 1
      - name: bin/pharos.js is still the JS launcher
        run: |
          link=$(npm prefix -g)/lib/node_modules/pharos-mcp/bin/pharos.js
          [ -f "$link" ] && [ ! -L "$link" ] || { echo "$link should be the JS fallback" >&2; exit 1; }
      - name: pharos self update names the npm command
        shell: bash
        run: |
          if out=$(pharos self update 2>&1); then echo "self update should exit non-zero under npm: $out" >&2; exit 1; fi
          echo "$out"
          [[ "$out" == *"npm install -g pharos-mcp@latest"* ]] || { echo "self update didn't print the npm command" >&2; exit 1; }
      - name: Smoke through the fallback
        env:
          PHAROS_RUNTIME_DIR: ${{ runner.temp }}/pharos-rt
        run: python3 -I rel/smoke_mcp.py --pharos "$(command -v pharos)" --idle-exit
