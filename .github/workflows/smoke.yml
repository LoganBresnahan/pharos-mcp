# The post-release smoke (ADR-035 §7): on fresh runners, install a published
# pharos from its public URLs, exactly as a user would, and run it as an MCP
# client would. release.yml calls it after publishing; run it by hand for any
# version.
name: smoke

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The version to install (as published on npm and GitHub)
        type: string
        required: true

permissions:
  contents: read

jobs:
  # curl … install.sh | sh, then initialize, tools/list, a pyright hover, a
  # second session on the same daemon, and the daemon's idle exit.
  curl:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-22.04-arm, ubuntu-24.04-arm, macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      # The smoke scripts only: pharos itself comes from the release.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rel
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pyright
      - name: Smoke
        run: sh rel/smoke.sh --version "${{ inputs.version }}" --lsp pyright

  # npm install -g pharos-mcp@VERSION: the same checks, and the postinstall
  # swap proved: no node in the MCP server's process tree.
  npm:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-22.04-arm, ubuntu-24.04-arm, macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rel
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pyright "pharos-mcp@${{ inputs.version }}"
      - name: pharos is the native shim
        run: |
          link=$(npm prefix -g)/lib/node_modules/pharos-mcp/bin/pharos.js
          [ -L "$link" ] || { echo "the postinstall didn't swap $link for the native shim" >&2; exit 1; }
          pharos --version
          [ "$(pharos --version)" = "pharos ${{ inputs.version }}" ]
      - name: Smoke
        env:
          PHAROS_RUNTIME_DIR: ${{ runner.temp }}/pharos-rt
        run: python3 -I rel/smoke_mcp.py --pharos "$(command -v pharos)" --expect-native --lsp pyright --idle-exit

  # npm install -g --ignore-scripts: the postinstall never runs, and the JS
  # fallback still serves MCP.
  npm-ignore-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rel
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g --ignore-scripts "pharos-mcp@${{ inputs.version }}"
      - name: bin/pharos.js is still the JS launcher
        run: |
          link=$(npm prefix -g)/lib/node_modules/pharos-mcp/bin/pharos.js
          [ -f "$link" ] && [ ! -L "$link" ] || { echo "$link should be the JS fallback" >&2; exit 1; }
      - name: Smoke through the fallback
        env:
          PHAROS_RUNTIME_DIR: ${{ runner.temp }}/pharos-rt
        run: python3 -I rel/smoke_mcp.py --pharos "$(command -v pharos)" --idle-exit
