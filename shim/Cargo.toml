[package]
name = "pharos-shim"
version = "0.2.0"
edition = "2021"
description = "pharos's front-end executable: the MCP stdio shim to the shared daemon, and the launcher for the bundled Erlang runtime (ADR-034)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "pharos"
path = "src/main.rs"

# Deliberately tiny: the shim is resident once per MCP session. Linux and
# macOS only (ADR-035): Windows users run pharos inside WSL.
[dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
